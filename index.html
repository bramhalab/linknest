<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2b1b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LinkNest — Save Any Link, Filed by Folder</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Special+Elite&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Auth Screen (Login / Signup) -->
<div id="auth-screen" style="display:none;"></div>

<!-- Lock Screen (PIN / Pattern / Custom) -->
<div id="lock-screen" style="display:none;"></div>

<!-- Main App -->
<div id="app" style="display:none;"></div>

<!-- Hidden file input for import -->
<input type="file" id="importFileInput" accept="application/json" style="display:none;">

<!-- Camera (hidden, for security photo) -->
<video id="secCamera" autoplay playsinline style="display:none;"></video>
<canvas id="secCanvas" style="display:none;"></canvas>

<script src="script.js"></script>
</body>
</html>
